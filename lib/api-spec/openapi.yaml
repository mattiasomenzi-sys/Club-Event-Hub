openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: events
    description: Events operations
  - name: gallery
    description: Gallery photo operations
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List all events
      description: Returns all events sorted by date ascending
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a new event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get a single event
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update an event
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events/{id}/participate:
    post:
      operationId: participateInEvent
      tags: [events]
      summary: Register interest in an event
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipationInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipationResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events/{id}/participations:
    get:
      operationId: listParticipations
      tags: [events]
      summary: List participations for an event (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of participations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParticipationResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gallery:
    get:
      operationId: listGalleryPhotos
      tags: [gallery]
      summary: List all gallery photos
      responses:
        "200":
          description: List of gallery photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryPhoto"
    post:
      operationId: createGalleryPhoto
      tags: [gallery]
      summary: Add a gallery photo (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryPhotoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryPhoto"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gallery/{id}:
    delete:
      operationId: deleteGalleryPhoto
      tags: [gallery]
      summary: Delete a gallery photo (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /banners:
    get:
      operationId: listBanners
      tags: [banners]
      summary: List all communication banners
      responses:
        "200":
          description: List of banners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Banner"
    post:
      operationId: createBanner
      tags: [banners]
      summary: Add a banner (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BannerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Banner"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /banners/{id}:
    delete:
      operationId: deleteBanner
      tags: [banners]
      summary: Delete a banner (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/me:
    get:
      operationId: getMyProfile
      tags: [profiles]
      summary: Get the current user's profile
      responses:
        "200":
          description: Profile found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not yet created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertMyProfile
      tags: [profiles]
      summary: Create or update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profiles:
    get:
      operationId: listProfiles
      tags: [profiles]
      summary: List all user profiles (admin)
      responses:
        "200":
          description: List of profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Event:
      type: object
      required: [id, title, description, date, time, isRecurring, isGenderless, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        date:
          type: string
          description: ISO date string (YYYY-MM-DD)
        time:
          type: string
          description: Time string (HH:MM)
        dresscode:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        registrationUrl:
          type: ["string", "null"]
        tickettailorEmbed:
          type: ["string", "null"]
        areaDescription:
          type: ["string", "null"]
        membershipInfo:
          type: ["string", "null"]
        memberQuotes:
          type: ["string", "null"]
        promo:
          type: ["string", "null"]
        memberNotes:
          type: ["string", "null"]
        isRecurring:
          type: boolean
        recurringPattern:
          type: ["string", "null"]
        recurringUntil:
          type: ["string", "null"]
          description: ISO date string (YYYY-MM-DD) — recurrence ends after this date
        isGenderless:
          type: boolean
        isPasswordProtected:
          type: boolean
        isDraft:
          type: boolean
        photoRequirement:
          type: string
          enum: [none, optional, required]
        createdAt:
          type: string
        updatedAt:
          type: string

    EventInput:
      type: object
      required: [title, date, time]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        date:
          type: string
          description: ISO date string (YYYY-MM-DD)
        time:
          type: string
          description: Time string (HH:MM)
        dresscode:
          type: string
        category:
          type: string
        imageUrl:
          type: string
        registrationUrl:
          type: string
        tickettailorEmbed:
          type: string
        areaDescription:
          type: string
        membershipInfo:
          type: string
        memberQuotes:
          type: string
        promo:
          type: string
        memberNotes:
          type: string
        isRecurring:
          type: boolean
        recurringPattern:
          type: string
        recurringUntil:
          type: string
        isGenderless:
          type: boolean
        isPasswordProtected:
          type: boolean
        password:
          type: string
        isDraft:
          type: boolean
        photoRequirement:
          type: string
          enum: [none, optional, required]

    EventUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        date:
          type: string
        time:
          type: string
        dresscode:
          type: string
        category:
          type: string
        imageUrl:
          type: string
        registrationUrl:
          type: string
        tickettailorEmbed:
          type: string
        areaDescription:
          type: string
        membershipInfo:
          type: string
        memberQuotes:
          type: string
        promo:
          type: string
        memberNotes:
          type: string
        isRecurring:
          type: boolean
        recurringPattern:
          type: string
        recurringUntil:
          type: string
        isGenderless:
          type: boolean
        isPasswordProtected:
          type: boolean
        password:
          type: string
        isDraft:
          type: boolean
        photoRequirement:
          type: string
          enum: [none, optional, required]

    ParticipationInput:
      type: object
      required: [name, contact]
      properties:
        name:
          type: string
          minLength: 1
        contact:
          type: string
          minLength: 1
        photoUrl:
          type: string

    ParticipationResponse:
      type: object
      required: [id, eventId, name, contact, createdAt]
      properties:
        id:
          type: integer
        eventId:
          type: integer
        name:
          type: string
        contact:
          type: string
        photoUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    GalleryPhoto:
      type: object
      required: [id, imageUrl, sortOrder, createdAt]
      properties:
        id:
          type: integer
        imageUrl:
          type: string
        caption:
          type: ["string", "null"]
        sortOrder:
          type: integer
        createdAt:
          type: string

    GalleryPhotoInput:
      type: object
      required: [imageUrl]
      properties:
        imageUrl:
          type: string
          minLength: 1
        caption:
          type: string

    Banner:
      type: object
      required: [id, imageUrl, sortOrder, createdAt]
      properties:
        id:
          type: integer
        imageUrl:
          type: string
        caption:
          type: ["string", "null"]
        sortOrder:
          type: integer
        createdAt:
          type: string

    BannerInput:
      type: object
      required: [imageUrl]
      properties:
        imageUrl:
          type: string
          minLength: 1
        caption:
          type: string
        sortOrder:
          type: integer

    Profile:
      type: object
      required: [id, nickname, age, email, memberType, interests, consentEmail, consentMessages, createdAt, updatedAt]
      properties:
        id:
          type: integer
        nickname:
          type: string
        age:
          type: integer
        email:
          type: string
        telegram:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        memberType:
          type: string
          enum: [singolo, coppia, singola, trav]
        interests:
          type: array
          items:
            type: string
            enum: [swinger, sexpositive, kinky, gangbang]
        consentEmail:
          type: boolean
        consentMessages:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    ProfileInput:
      type: object
      required: [nickname, age, email, memberType, interests, consentEmail, consentMessages]
      properties:
        nickname:
          type: string
          minLength: 1
        age:
          type: integer
          minimum: 18
        email:
          type: string
          minLength: 3
        telegram:
          type: string
        whatsapp:
          type: string
        memberType:
          type: string
          enum: [singolo, coppia, singola, trav]
        interests:
          type: array
          items:
            type: string
            enum: [swinger, sexpositive, kinky, gangbang]
        consentEmail:
          type: boolean
        consentMessages:
          type: boolean

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
