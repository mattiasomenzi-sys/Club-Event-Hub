kind = "web"
previewPath = "/"
title = "Boxx Club"
version = "1.0.0"
id = "artifacts/boxx-club"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22255

[services.development]
run = "pnpm --filter @workspace/boxx-club run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/boxx-club", "run", "build" ]
publicDir = "artifacts/boxx-club/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22255"
BASE_PATH = "/"
